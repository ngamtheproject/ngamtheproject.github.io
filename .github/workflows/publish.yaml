# Build the Hugo site with HugoBlox Kit (Tailwind CSS v4 + Pagefind search) and deploy it to GitHub Pages.
# Based on the HugoBlox Kit template workflows (build.yml + deploy.yml), inlined into one file.
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Fetch history for Hugo's .GitInfo and .Lastmod
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # HugoBlox Kit pins the Hugo version in hugoblox.yaml (yq is preinstalled on GitHub runners)
      - name: Get Hugo version
        run: echo "HUGO_VERSION=$(yq '.build.hugo_version' hugoblox.yaml)" >> "$GITHUB_ENV"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Test
        run: node --test tests/netlify-footer-host.test.js

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # Cache Hugo modules and processed images between runs
      - name: Cache Hugo modules and resources
        uses: actions/cache@v5
        with:
          path: |
            /tmp/hugo_cache_runner/
            resources/
          key: ${{ runner.os }}-hugo-${{ hashFiles('go.mod', 'package-lock.json', 'config/**/*', 'assets/**/*') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build Pagefind search index
        run: npm run pagefind

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
