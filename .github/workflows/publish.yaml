# Build the site with Hugo 0.154.5 extended and deploy it to GitHub Pages.
# Hugo is pinned to the version in the Ubuntu 26.04 LTS archive, which local
# builds use; see README.md. The theme needs no Go modules and no npm.
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a production deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.154.5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Hugo extended
        run: |
          deb="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          curl -fsSL -o "${RUNNER_TEMP}/${deb}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${deb}"
          sudo dpkg -i "${RUNNER_TEMP}/${deb}"
          hugo version

      - name: Test the Netlify footer credit
        run: node --test tests/netlify-footer-host.test.js

      # Resized album images take minutes to make from scratch; reuse them.
      - name: Cache processed images
        uses: actions/cache@v6
        with:
          path: resources/_gen
          key: hugo-gen-${{ env.HUGO_VERSION }}-${{ hashFiles('assets/media/**', 'content/**/*.jpg', 'config/**', 'layouts/**') }}
          restore-keys: |
            hugo-gen-${{ env.HUGO_VERSION }}-

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
