# Hugo configuration. Build with Hugo 0.154.5 extended; no modules, no Node.
# Reference: https://gohugo.io/configuration/all/

title: Ngăm
baseURL: 'https://ngamtheproject.github.io/'

defaultContentLanguage: vi
defaultContentLanguageInSubdir: false
# Keeps the live URLs: accents are stripped, but `đ` stays (/author/le-thanh-đat/).
removePathAccents: true

enableEmoji: true
enableRobotsTXT: true
summaryLength: 30
# The albums page waits on hundreds of image derivatives during a cold build.
timeout: 600000

disableAliases: true
pagination:
  pagerSize: 10
  # false keeps the /…/page/1/ redirect pages the old site had.
  disableAliases: false

permalinks:
  term:
    authors: '/author/:slug/'
    tags: '/tag/:slug/'
    categories: '/category/:slug/'
    publication_types: '/publication-type/:slug/'

taxonomies:
  tag: tags
  category: categories
  publication_type: publication_types
  author: authors

mediaTypes:
  application/manifest+json:
    suffixes: [webmanifest]

outputFormats:
  WebAppManifest:
    mediaType: application/manifest+json
    baseName: manifest
    rel: manifest
    isPlainText: true
    notAlternative: true

outputs:
  home: [HTML, RSS, JSON, WebAppManifest]
  section: [HTML, RSS]

imaging:
  resampleFilter: lanczos
  quality: 75
  anchor: smart
  hint: photo
  # Fills the transparent corners of PNGs (logo, icon) when JPEGs are made.
  bgColor: '#fef4e6'

markup:
  goldmark:
    renderer:
      unsafe: true

related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70

cascade:
  - target:
      path: /**
    params:
      commentable: true
