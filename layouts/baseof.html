<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
  {{- partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ with .Section }} section-{{ . }}{{ end }}">
  <a class="skip-link" href="#main">Bỏ qua đến nội dung</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{- block "main" . }}{{ end -}}
  </main>
  {{ partial "footer.html" . }}
  {{- $js := resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
