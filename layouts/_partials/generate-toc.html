<script>
  function generateNestedTOC() {
    const toc = document.getElementById("TableOfContents");
    // Only the album/video headings that follow the in-page TOC, not the site header or footer.
    const headings = document.querySelectorAll(["h2", "h3", "h4", "h5", "h6"].map((h) => ".ngam-toc-inpage ~ " + h).join(", "));

    let currentLevel = 2;
    let currentUl = toc.querySelector("ul");
    headings.forEach((heading) => {
      const level = parseInt(heading.tagName.charAt(1));
      const li = document.createElement("li");

      const link = document.createElement("a");
      link.href = `#${heading.id}`;
      link.textContent = heading.textContent;

      li.appendChild(link);

      if (level > currentLevel) {
        const ul = document.createElement("ul");
        ul.appendChild(li);
        currentUl.lastElementChild.appendChild(ul);
        currentUl = ul;
      } else if (level < currentLevel) {
        while (currentLevel > level) {
          currentUl = currentUl.parentElement.parentElement;
          currentLevel--;
        }
        currentUl.appendChild(li);
      } else {
        currentUl.appendChild(li);
      }

      currentLevel = level;
    });
  }

  generateNestedTOC();
</script>
