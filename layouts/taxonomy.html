{{ define "main" }}
<div class="container page-list">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
  </header>
  {{- with .Pages }}
  <ul class="tags tags-large">
    {{- range .ByTitle }}
    <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}{{ with len .Pages }} <span class="count">{{ . }}</span>{{ end }}</a></li>
    {{- end }}
  </ul>
  {{- else }}
  <p>Chưa có mục nào.</p>
  {{- end }}
</div>
{{ end }}
