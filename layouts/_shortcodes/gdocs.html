{{/* Google Docs / Drive embed shortcode (ported from HugoBlox Bootstrap v5 for HugoBlox Kit).

     Parameters
     ----------
     src : str
         Google Docs or Drive preview URL to embed.
*/}}
<div class="ngam-embed not-prose">
  <iframe src="{{ .Get "src" }}" frameborder="0" width="960" height="569" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true" loading="lazy"></iframe>
</div>
